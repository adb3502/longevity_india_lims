# OpenSpecimen Configuration File for Longevity India

# The name of the application, used in various contexts.
app.name=openspecimen

# The absolute path to the Tomcat directory.
# This is NOT used by the app at runtime, but good to have for reference.
# tomcat.dir=/opt/tomcat9

# The absolute path to the directory where OpenSpecimen will store data,
# such as uploaded files and plugins.
app.data_dir=/opt/tomcat9/os-data

# JNDI name of the datasource configured in Tomcat's openspecimen.xml
# This is the key that links this file to the database configuration.
datasource.jndi=jdbc/openspecimen

# Specifies that this is a fresh installation.
# The application will build its database schema from scratch.
datasource.type=fresh

# The type of database being used.
database.type=mysql
